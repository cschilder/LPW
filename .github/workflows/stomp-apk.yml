name: Build STOMP APK

# Bouwt de Capacitor-app in voorbeeld/stomp tot een debug-APK en uploadt
# hem als artifact. Handmatig te starten, of automatisch bij wijzigingen
# aan de app.
on:
  workflow_dispatch:
  push:
    paths:
      - 'voorbeeld/stomp/**'
      - '.github/workflows/stomp-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voorbeeld/stomp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js opzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JDK 21 opzetten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK opzetten
        uses: android-actions/setup-android@v3

      - name: Capacitor + plugins installeren
        run: npm install

      - name: Android-platform toevoegen
        run: npx cap add android

      - name: Web-assets synchroniseren
        run: npx cap sync android

      - name: Debug-APK bouwen
        working-directory: voorbeeld/stomp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK uploaden als artifact
        uses: actions/upload-artifact@v4
        with:
          name: stomp-debug-apk
          path: voorbeeld/stomp/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
